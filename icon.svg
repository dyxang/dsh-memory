<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Back cards: the stack of memory files behind the index. -->
  <rect x="20" y="8" width="30" height="40" rx="5" fill="none" stroke="#4D6BFE" stroke-width="3" opacity="0.45"/>
  <rect x="14" y="14" width="30" height="40" rx="5" fill="none" stroke="#4D6BFE" stroke-width="3" opacity="0.7"/>
  <!-- Front card: the memory file, with its frontmatter lines. -->
  <rect x="8" y="20" width="34" height="38" rx="5" fill="none" stroke="#4D6BFE" stroke-width="3"/>
  <line x1="15" y1="30" x2="35" y2="30" stroke="#4D6BFE" stroke-width="3" stroke-linecap="round"/>
  <line x1="15" y1="38" x2="35" y2="38" stroke="#4D6BFE" stroke-width="3" stroke-linecap="round"/>
  <line x1="15" y1="46" x2="27" y2="46" stroke="#4D6BFE" stroke-width="3" stroke-linecap="round"/>
</svg>
